<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#122225"><title>Sign in · OrthoGraph</title><style>
:root{font-family:Inter,system-ui,sans-serif;color:#172a2b;background:#edf2ed}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(100%,430px);padding:38px;background:white;border:1px solid #dce5de;border-radius:18px;box-shadow:0 20px 60px #15312712}.brand{font-size:25px;font-weight:750;letter-spacing:-1px;color:#164638}.brand span{color:#4c8f70}.eyebrow{margin:29px 0 8px;color:#618575;font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase}h1{margin:0;font-size:31px;letter-spacing:-1.3px}p{line-height:1.6;color:#72827a;font-size:13px}label{display:block;margin:20px 0 0;font-size:12px;font-weight:700;color:#425c4f}input{display:block;width:100%;margin-top:8px;padding:13px 14px;border:1px solid #ccd9d0;border-radius:8px;font:inherit;font-size:14px}input:focus{outline:3px solid #aee0c7;border-color:#367e5c}button{width:100%;margin-top:25px;padding:14px;border:0;border-radius:8px;background:#276d60;color:white;font:inherit;font-weight:700;cursor:pointer}button:disabled{opacity:.55}.hidden{display:none}.setup{margin-top:23px;padding:16px;background:#f4f8f3;border-radius:9px}.setup summary{cursor:pointer;font-size:13px;font-weight:650}.setup p{margin-bottom:0}#error{min-height:18px;color:#a53f39;margin:12px 0 0}.text-link{color:#276d60;font-weight:700}.text-link:hover{text-decoration:underline}.foot{margin-top:26px;border-top:1px solid #edf0ed;padding-top:18px;font-size:11px;color:#8a9b91}
</style></head><body><main class="card"><div class="brand">⌘ Ortho<span>Graph</span></div><div class="eyebrow">Private research workspace</div><h1>Welcome back.</h1><p>Sign in to review panoramic images and your saved cases. New here? <a class="text-link" href="/register">Create an account</a>.</p><form id="form"><label>Username<input name="username" autocomplete="username" required></label><label>Password<input name="password" type="password" autocomplete="current-password" required></label><div class="setup hidden" id="setup"><strong>Choose a new password</strong><p>This account uses a temporary password. Set your own to finish signing in.</p><label>New password<input name="new_password" type="password" autocomplete="new-password" minlength="12" maxlength="128"></label><label>Confirm new password<input name="confirm_password" type="password" autocomplete="new-password" minlength="12" maxlength="128"></label></div><p id="error" role="alert"></p><button id="submit">Sign in →</button></form><div class="foot">Research and education only · Use de-identified images</div></main><script>
const form=document.getElementById('form'),error=document.getElementById('error'),button=document.getElementById('submit'),setup=document.getElementById('setup');
form.addEventListener('submit',async e=>{e.preventDefault();error.textContent='';const fields=new FormData(form);if(!setup.classList.contains('hidden')&&fields.get('new_password')!==fields.get('confirm_password')){error.textContent='New passwords do not match.';return;}button.disabled=true;try{const body={username:fields.get('username'),password:fields.get('password')};if(fields.get('new_password'))body.new_password=fields.get('new_password');const response=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const result=await response.json();if(response.status===428&&result.code==='set_password_required'){setup.classList.remove('hidden');setup.querySelectorAll('input').forEach(input=>input.required=true);error.textContent=result.detail;setup.querySelector('input').focus();return;}if(!response.ok)throw Error(result.detail||'Sign-in failed.');location.replace('/');}catch(err){error.textContent=err.message;}finally{button.disabled=false;}});
</script></body></html>
