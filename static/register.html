<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#122225"><title>Create account · OrthoGraph</title><style>
:root{font-family:Inter,system-ui,sans-serif;color:#172a2b;background:#edf2ed}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(100%,430px);padding:38px;background:white;border:1px solid #dce5de;border-radius:18px;box-shadow:0 20px 60px #15312712}.brand{font-size:25px;font-weight:750;letter-spacing:-1px;color:#164638}.brand span{color:#4c8f70}.eyebrow{margin:29px 0 8px;color:#618575;font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase}h1{margin:0;font-size:31px;letter-spacing:-1.3px}p{line-height:1.6;color:#72827a;font-size:13px}a{color:#276d60;font-weight:700;text-decoration:none}a:hover{text-decoration:underline}label{display:block;margin:20px 0 0;font-size:12px;font-weight:700;color:#425c4f}input{display:block;width:100%;margin-top:8px;padding:13px 14px;border:1px solid #ccd9d0;border-radius:8px;font:inherit;font-size:14px}input:focus{outline:3px solid #aee0c7;border-color:#367e5c}button{width:100%;margin-top:25px;padding:14px;border:0;border-radius:8px;background:#276d60;color:white;font:inherit;font-weight:700;cursor:pointer}button:disabled{opacity:.55}.hint{margin:8px 0 0;font-size:11px}#error{min-height:18px;color:#a53f39;margin:12px 0 0}.foot{margin-top:26px;border-top:1px solid #edf0ed;padding-top:18px;font-size:11px;color:#8a9b91}
</style></head><body><main class="card"><div class="brand">⌘ Ortho<span>Graph</span></div><div class="eyebrow">Research workspace</div><h1>Create an account.</h1><p>Already have one? <a href="/login">Sign in</a>. Each account sees only its own cases.</p><form id="form"><label>Username<input name="username" autocomplete="username" minlength="3" maxlength="32" pattern="[A-Za-z][A-Za-z0-9_.-]{2,31}" required></label><p class="hint">Start with a letter; use letters, numbers, dots, underscores or hyphens.</p><label>Password<input name="password" type="password" autocomplete="new-password" minlength="12" maxlength="128" required></label><label>Confirm password<input name="confirm" type="password" autocomplete="new-password" minlength="12" maxlength="128" required></label><p id="error" role="alert"></p><button id="submit">Create account →</button></form><div class="foot">No email required. Password recovery is not available yet. Use de-identified images only.</div></main><script>
const form=document.getElementById('form'),error=document.getElementById('error'),button=document.getElementById('submit');form.addEventListener('submit',async e=>{e.preventDefault();error.textContent='';const fields=new FormData(form);if(fields.get('password')!==fields.get('confirm')){error.textContent='Passwords do not match.';return;}button.disabled=true;try{const response=await fetch('/api/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:fields.get('username'),password:fields.get('password')})});const result=await response.json();if(!response.ok)throw Error(result.detail||'Could not create account.');location.replace('/');}catch(err){error.textContent=err.message;button.disabled=false;}});
</script></body></html>
